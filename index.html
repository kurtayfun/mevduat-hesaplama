<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mevduat Karşılaştırma Aracı</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 25px; font-size: 14px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .section { background: #f8f9fa; padding: 20px; border-radius: 6px; border: 1px solid #e9ecef; }
        .full-width { grid-column: span 2; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #495057; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .results { margin-top: 25px; padding: 20px; border-radius: 6px; display: none; }
        .winner-daily { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .winner-classic { background-color: #fff3cd; border: 1px solid #ffeeba; color: #856404; }
        .footer { text-align: center; margin-top: 30px; font-size: 14px; color: #7f8c8d; border-top: 1px solid #eee; padding-top: 15px; }
        .footer a { color: #1da1f2; text-decoration: none; font-weight: bold; }
        .footer a:hover { text-decoration: underline; }
        h3 { margin-top: 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Mevduat Getiri ve Karşılaştırma Aracı</h2>
    <div class="subtitle">Boşta Kalan Tutar ve Günlük Bileşik Faiz Hesaplanarak Kurgulanmıştır</div>
    
    <div class="grid">
        <div class="section full-width">
            <label for="anapara">Toplam Anapara (TL)</label>
            <input type="number" id="anapara" placeholder="Örn: 500000" value="500000">
        </div>

        <div class="section">
            <h3>Seçenek 1: Günlük Hesap</h3>
            <label for="gunlukOran">Brüt Faiz Oranı (%)</label>
            <input type="number" id="gunlukOran" step="0.1" placeholder="Örn: 45" value="45">
            
            <label for="bostaKalan">Boşta Kalan Vadesiz Tutar (TL)</label>
            <input type="number" id="bostaKalan" placeholder="Örn: 20000" value="20000">
        </div>

        <div class="section">
            <h3>Seçenek 2: Düz 32 Günlük</h3>
            <label for="duzOran">Brüt Faiz Oranı (%)</label>
            <input type="number" id="duzOran" step="0.1" placeholder="Örn: 42" value="42">
        </div>
    </div>

    <button onclick="hesapla()">Getirileri Karşılaştır</button>

    <div id="resultBox" class="results">
        <h3 id="resultTitle">Sonuç</h3>
        <p id="dailyResultText"></p>
        <p id="classicResultText"></p>
        <hr>
        <p id="comparisonText" style="font-weight: bold; font-size: 18px;"></p>
    </div>

    <div class="footer">
        Geliştirici: <a href="https://x.com/kurtayfun" target="_blank">Güvenilir Bankacı @kurtayfun</a>
    </div>
</div>

<script>
function hesapla() {
    const anapara = parseFloat(document.getElementById('anapara').value);
    const gunlukOran = parseFloat(document.getElementById('gunlukOran').value);
    const bostaKalan = parseFloat(document.getElementById('bostaKalan').value);
    const duzOran = parseFloat(document.getElementById('duzOran').value);
    
    if (isNaN(anapara) || isNaN(gunlukOran) || isNaN(bostaKalan) || isNaN(duzOran)) {
        alert("Lütfen tüm alanları eksiksiz doldurun.");
        return;
    }

    const stopaj = 0.175; 
    const vadeGun = 32;

    let bilesikAnapara = anapara;
    for (let i = 0; i < vadeGun; i++) {
        let nemalanan = bilesikAnapara - bostaKalan;
        if (nemalanan > 0) {
            let gunlukBrut = (nemalanan * gunlukOran) / 36500;
            let gunlukNet = gunlukBrut * (1 - stopaj);
            bilesikAnapara += gunlukNet;
        }
    }
    const gunlukNetKazanc = bilesikAnapara - anapara;

    const duzBrutKazanc = (anapara * duzOran * vadeGun) / 36500;
    const duzNetKazanc = duzBrutKazanc * (1 - stopaj);

    const resultBox = document.getElementById('resultBox');
    const resultTitle = document.getElementById('resultTitle');
    const dailyResultText = document.getElementById('dailyResultText');
    const classicResultText = document.getElementById('classicResultText');
    const comparisonText = document.getElementById('comparisonText');

    dailyResultText.innerText = `Günlük Hesap (32 Günlük Bileşik Toplam): ${gunlukNetKazanc.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} TL net getiri.`;
    classicResultText.innerText = `Klasik 32 Günlük Hesap: ${duzNetKazanc.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} TL net getiri.`;

    const fark = Math.abs(gunlukNetKazanc - duzNetKazanc).toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2});

    if (gunlukNetKazanc > duzNetKazanc) {
        resultBox.className = "results winner-daily";
        resultTitle.innerText = "🏆 Günlük Hesap Daha Avantajlı!";
        comparisonText.innerText = `Günlük hesabı seçerseniz 32 gün sonunda ${fark} TL daha fazla kazanacaksınız.`;
    } else if (duzNetKazanc > gunlukNetKazanc) {
        resultBox.className = "results winner-classic";
        resultTitle.innerText = "🏆 Klasik 32 Günlük Vadeli Daha Avantajlı!";
        comparisonText.innerText = `Klasik vadeli hesabı seçerseniz 32 gün sonunda ${fark} TL daha fazla kazanacaksınız.`;
    } else {
        resultBox.className = "results";
        resultTitle.innerText = "Berabere!";
        comparisonText.innerText = "Her iki seçeneğin de getirisi kuruşu kuruşuna aynıdır.";
    }

    resultBox.style.display = 'block';
}
</script>

</body>
</html>
