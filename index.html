<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mevduat Karşılaştırma Aracı</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; }
        .container { max-width: 650px; margin: 20px auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; font-size: 24px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; font-size: 13px; line-height: 1.4; }
        .section { background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e9ecef; margin-bottom: 20px; }
        .section h3 { margin-top: 0; margin-bottom: 15px; color: #34495e; font-size: 16px; border-bottom: 2px solid #007bff; padding-bottom: 5px; display: inline-block; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #495057; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 16px; transition: border-color 0.2s; }
        input:focus { border-color: #007bff; outline: none; }
        input::placeholder { color: #adb5bd; }
        .btn-container { margin: 25px 0; }
        button { width: 100%; padding: 15px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #0056b3; }
        .results { margin-top: 25px; padding: 20px; border-radius: 8px; display: none; line-height: 1.6; }
        .winner-daily { background-color: #e2f0d9; border: 1px solid #b5d99c; color: #2e5b1a; }
        .winner-classic { background-color: #fff3cd; border: 1px solid #ffeeba; color: #856404; }
        .results p { margin: 10px 0; font-size: 15px; }
        .results hr { border: 0; border-top: 1px solid rgba(0,0,0,0.1); margin: 15px 0; }
        .footer { text-align: center; margin-top: 35px; font-size: 13px; color: #95a5a6; border-top: 1px solid #eee; padding-top: 20px; }
        .footer a { color: #1da1f2; text-decoration: none; font-weight: bold; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>Mevduat Getiri ve Karşılaştırma Aracı</h2>
    <div class="subtitle">Boşta Kalan Tutar ve Günlük Bileşik Faiz Hesaplanarak Kurgulanmıştır</div>
    
    <div class="section">
        <label for="anapara">Toplam Anapara (TL)</label>
        <input type="text" id="anapara" placeholder="Örn: 500.000" oninput="formatInput(this)">
    </div>

    <div class="section">
        <h3>Seçenek 1: Günlük Hesap</h3>
        <label for="gunlukOran">Brüt Faiz Oranı (%)</label>
        <input type="number" id="gunlukOran" step="0.1" placeholder="Örn: 45">
        
        <label for="bostaKalan">Boşta Kalan Vadesiz Tutar (TL)</label>
        <input type="text" id="bostaKalan" placeholder="Örn: 20.000" oninput="formatInput(this)">
    </div>

    <div class="section">
        <h3>Seçenek 2: Düz 32 Günlük</h3>
        <label for="duzOran">Brüt Faiz Oranı (%)</label>
        <input type="number" id="duzOran" step="0.1" placeholder="Örn: 42">
    </div>

    <div class="btn-container">
        <button onclick="hesapla()">Getirileri Karşılaştır</button>
    </div>

    <div id="resultBox" class="results">
        <h3 id="resultTitle" style="border:none; margin-bottom:10px;">Sonuç</h3>
        <p id="dailyResultText"></p>
        <p id="classicResultText"></p>
        <hr>
        <p id="comparisonText" style="font-weight: bold; font-size: 17px; margin-bottom:0;"></p>
    </div>

    <div class="footer">
        Geliştirici: <a href="https://x.com/kurtayfun" target="_blank">Güvenilir Bankacı @kurtayfun</a>
    </div>
</div>

<script>
function formatInput(input) {
    let value = input.value.replace(/\D/g, "");
    if (value === "") {
        input.value = "";
        return;
    }
    input.value = new Intl.NumberFormat('tr-TR').format(parseInt(value));
}

function getRawValue(id) {
    const val = document.getElementById(id).value.replace(/\./g, "");
    return parseFloat(val);
}

function hesapla() {
    const anapara = getRawValue('anapara');
    const gunlukOran = parseFloat(document.getElementById('gunlukOran').value);
    const bostaKalan = getRawValue('bostaKalan');
    const duzOran = parseFloat(document.getElementById('duzOran').value);
    
    if (isNaN(anapara) || isNaN(gunlukOran) || isNaN(bostaKalan) || isNaN(duzOran)) {
        alert("Lütfen tüm alanları eksiksiz doldurun.");
        return;
    }

    const stopaj = 0.175; 
    const vadeGun = 32;

    let bilesikAnapara = anapara;
    for (let i = 0; i < vadeGun; i++) {
        let nemalanan = bilesikAnapara - bostaKalan;
        if (nemalanan > 0) {
            let gunlukBrut = (nemalanan * gunlukOran) / 36500;
            let gunlukNet = gunlukBrut * (1 - stopaj);
            bilesikAnapara += gunlukNet;
        }
    }
    const gunlukNetKazanc = bilesikAnapara - anapara;

    const duzBrutKazanc = (anapara * duzOran * vadeGun) / 36500;
    const duzNetKazanc = duzBrutKazanc * (1 - stopaj);

    const resultBox = document.getElementById('resultBox');
    const resultTitle = document.getElementById('resultTitle');
    const dailyResultText = document.getElementById('dailyResultText');
    const classicResultText = document.getElementById('classicResultText');
    const comparisonText = document.getElementById('comparisonText');

    dailyResultText.innerText = `Günlük Hesap (32 Günlük Bileşik Toplam): ${gunlukNetKazanc.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} TL net getiri.`;
    classicResultText.innerText = `Klasik 32 Günlük Hesap: ${duzNetKazanc.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} TL net getiri.`;

    const fark = Math.abs(gunlukNetKazanc - duzNetKazanc).toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2});

    if (gunlukNetKazanc > duzNetKazanc) {
        resultBox.className = "results winner-daily";
        resultTitle.innerText = "🏆 Günlük Hesap Daha Avantajlı!";
        comparisonText.innerText = `Günlük hesabı seçerseniz 32 gün sonunda ${fark} TL daha fazla kazanacaksınız.`;
    } else if (duzNetKazanc > gunlukNetKazanc) {
        resultBox.className = "results winner-classic";
        resultTitle.innerText = "🏆 Klasik 32 Günlük Vadeli Daha Avantajlı!";
        comparisonText.innerText = `Klasik vadeli hesabı seçerseniz 32 gün sonunda ${fark} TL daha fazla kazanacaksınız.`;
    } else {
        resultBox.className = "results";
        resultTitle.innerText = "Berabere!";
        comparisonText.innerText = "Her iki seçeneğin de getirisi kuruşu kuruşuna aynıdır.";
    }

    resultBox.style.display = 'block';
    resultBox.scrollIntoView({ behavior: 'smooth' });
}
</script>

</body>
</html>
